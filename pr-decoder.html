<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PR-Nummern Decoder · VAG Toolbox</title>
<style>
*{box-sizing:border-box}
:root{--bg:#020812;--panel:rgba(4,18,32,.92);--line:rgba(36,111,160,.78);--text:#f4f8fc;--muted:#9fb5c7;--blue:#0aa5ff;--blue2:#0878ed}
html{background:var(--bg)}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:linear-gradient(rgba(1,7,14,.62),rgba(1,7,14,.84)),url('vag-toolbox-login.jpg?v=50') center top/cover fixed no-repeat,var(--bg)}
.wrap{max-width:980px;margin:auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 18px 45px rgba(0,0,0,.3);backdrop-filter:blur(6px)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:52px;height:52px;border-radius:14px;border:1px solid rgba(33,170,255,.75);background:linear-gradient(135deg,#073a67,#0aa5ff);display:grid;place-items:center;font-weight:900}
.title{flex:1;min-width:230px} h1{margin:0 0 4px;font-size:28px} h2{font-size:17px;color:#42b8ff;margin:0 0 14px}
.sub,.muted{color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{border:1px solid rgba(60,116,154,.72);border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer;background:rgba(8,28,45,.96);color:#dfefff}
.primary{background:linear-gradient(90deg,var(--blue2),var(--blue));border-color:#16a8ff;color:#fff}
.search{display:grid;grid-template-columns:1fr auto;gap:10px}
input{width:100%;padding:15px;border:1px solid #52718a;border-radius:10px;background:#edf4ff;color:#101820;font-size:18px;text-transform:uppercase;outline:none}
input:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(10,165,255,.18)}
.result{margin-top:14px;display:none}
.hit{background:rgba(6,25,43,.82);border:1px solid rgba(47,99,135,.6);border-radius:12px;padding:16px;margin-top:10px}
.code{font:800 22px Consolas,monospace;color:#66c5ff;margin-bottom:5px}
.desc{font-size:16px;line-height:1.45}
.notfound{color:#ffb3b3}
.footer{text-align:center;color:#7790a2;font-size:11px;padding:6px 0 18px}
#app{display:none}.ready #app{display:block}
@media(max-width:600px){.wrap{padding:10px}.card{padding:15px;border-radius:14px}.search{grid-template-columns:1fr}.actions{width:100%}.actions button{flex:1}h1{font-size:23px}}
</style>
<script>
const U='https://mjvqdhclkqgrvqfaafzp.supabase.co';
const K='sb_publishable_H4rBbPLak0JM-9pU2ympmw_sK9Wc1En';
(async()=>{
 const t=localStorage.getItem('mk100_token')||sessionStorage.getItem('mk100_token');
 if(!t){location.replace('index.html');return}
 try{
   const u=await fetch(U+'/auth/v1/user',{headers:{apikey:K,Authorization:'Bearer '+t}});
   if(!u.ok)throw 0;
   const user=await u.json();
   const r=await fetch(U+'/rest/v1/mk100_members?select=status,is_active&user_id=eq.'+encodeURIComponent(user.id),{headers:{apikey:K,Authorization:'Bearer '+t}});
   if(!r.ok)throw 0;
   const a=await r.json();
   if(!a[0]||a[0].status!=='approved'||a[0].is_active!==true)throw 0;
   document.documentElement.classList.add('ready');
 }catch(e){
   localStorage.removeItem('mk100_token');sessionStorage.removeItem('mk100_token');
   location.replace('index.html?access=denied');
 }
})();
</script>
</head>
<body>
<div id="app"><div class="wrap">
<div class="card"><div class="top">
<div class="logo">PR</div>
<div class="title"><h1>PR-Nummern Decoder</h1><div class="sub">VAG Toolbox · PR-Code eingeben und Bedeutung anzeigen</div></div>
<div class="actions"><button onclick="location.href='toolbox.html'">← TOOLBOX</button><button onclick="logout()">ABMELDEN</button></div>
</div></div>

<div class="card">
<h2>PR-Code suchen</h2>
<div class="search">
<input id="q" maxlength="80" placeholder="z. B. 1AT oder 7K1 8T6" onkeydown="if(event.key==='Enter')decodePR()">
<button class="primary" onclick="decodePR()">SUCHEN</button>
</div>
<div class="muted" style="margin-top:10px">Ein oder mehrere 3-stellige PR-Codes eingeben. Trennung per Leerzeichen, Komma oder Zeilenumbruch.</div>
<div id="result" class="result"></div>
</div>

<div class="footer">VAG Toolbox</div>
</div></div>

function logout(){localStorage.removeItem('mk100_token');sessionStorage.removeItem('mk100_token');location.href='index.html'}
function esc(s){return String(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]))}
function decodePR(){
  const raw=document.getElementById('q').value.toUpperCase();
  const codes=[...new Set((raw.match(/[A-Z0-9]{3}/g)||[]))];
  const box=document.getElementById('result');
  box.style.display='block';
  if(!codes.length){
    box.innerHTML='<div class="hit notfound">Bitte mindestens einen 3-stelligen PR-Code eingeben.</div>';
    return;
  }
  box.innerHTML=codes.map(c=>PR[c]
    ? `<div class="hit"><div class="code">${c}</div><div class="desc">${esc(PR[c])}</div></div>`
    : `<div class="hit"><div class="code">${c}</div><div class="desc notfound">PR-Code nicht in der aktuellen Datenbank gefunden.</div></div>`
  ).join('');
}
</script>
</body>
