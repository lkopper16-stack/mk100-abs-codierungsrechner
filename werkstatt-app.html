/* Fahrzeugakten UX 18: kompakte Übersicht und strukturierte Detailkarte */
.case{position:relative;border-left:5px solid #2b82bd!important}
.case[data-status="in_progress"],.case[data-status="waiting"]{border-left-color:#f0b849!important}
.case[data-status="ready"]{border-left-color:#39c987!important}
.case[data-status="closed"]{border-left-color:#6f8292!important}
.caseGo{position:absolute;right:20px;bottom:18px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#183047;color:#8ecfff;font-size:23px;font-weight:900}
.metaChip{display:inline-flex;align-items:center;min-height:31px;padding:5px 10px;border-radius:9px;background:#091827;border:1px solid #1d3448;color:#b8c8d5}
.updated{color:#7891a5}
.detailcard{background:linear-gradient(145deg,#0d1b2a,#0a1724)}
.detailgrid{align-items:stretch}
.kv{background:#091725;border:1px solid #1c3449;border-radius:14px;padding:14px!important;min-width:0}
.kv.wide{grid-column:1/-1}
.kv span{display:block;overflow-wrap:anywhere}
.detailStatus{display:inline-flex!important;width:auto;padding:8px 12px;border-radius:999px;background:#17324a;color:#9bd2fb;font-weight:900}
.detailStatus.waiting,.detailStatus.in_progress{background:#3d3114;color:#ffd677}
.detailStatus.ready{background:#123b2b;color:#6fe4aa}
.detailStatus.closed{background:#1d2935;color:#aebdca}
.quick button{display:flex;align-items:center;justify-content:center}
.file img{aspect-ratio:16/10!important}
@media(max-width:950px), (pointer:coarse){
  .case{min-height:0!important;padding:22px 22px 20px!important}
  .caseMeta{padding-right:48px!important}
  .caseGo{right:18px;bottom:18px}
  .detailgrid{grid-template-columns:1fr 1fr!important;gap:12px!important}
  .kv{padding:15px!important}
  .kv.wide{grid-column:1/-1!important}
  .quick{grid-template-columns:1fr 1fr!important}
  .files{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important}
  .file{padding:0!important}
  .filebody{padding:14px!important}
  .filebody b{font-size:15px!important;white-space:normal!important;display:-webkit-box!important;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .filebody small,.category{font-size:12px!important}
}
@media(max-width:460px){

  .kv.wide{grid-column:auto!important}
  .quick{grid-template-columns:1fr!important}
  .files{grid-template-columns:1fr 1fr!important}
}

<script>
const U='https://mjvqdhclkqgrvqfaafzp.supabase.co',K='sb_publishable_H4rBbPLak0JM-9pU2ympmw_sK9Wc1En';let TOKEN='',REFRESH='',USER=null,SHOPS=[],SHOP=null,CASES=[],CURRENT=null,CURRENT_FILES=[],PENDING=[],SHOW_ARCHIVE=false;const $=id=>document.getElementById(id);const headers=()=>TOKEN?{apikey:K,Authorization:'Bearer '+TOKEN}:{apikey:K};function show(id,t,e=false){const n=$(id);n.textContent=t;n.className='msg'+(e?' err':'');n.style.display=t?'block':'none'}async function api(path,opt={}){const r=await fetch(U+path,{...opt,headers:{...headers(),...(opt.headers||{})}});let j=null;try{j=await r.json()}catch{}if(!r.ok)throw Error(j?.message||j?.error_description||j?.error||'HTTP '+r.status);return j}

$('search').oninput=renderCases;$('archiveBtn').onclick=()=>{SHOW_ARCHIVE=!SHOW_ARCHIVE;$('search').value='';renderCases()};$('newCase').onclick=()=>openCaseForm();function openCaseForm(c=null){$('caseForm').reset();$('caseId').value=c?.id||'';$('caseDialogTitle').textContent=c?'Fahrzeugakte bearbeiten':'Neue Fahrzeugakte';$('plate').value=c?.plate||'';$('vin').value=c?.vin||'';$('vehicle').value=c?.vehicle||'';$('customer').value=c?.customer_name||'';$('mileage').value=c?.mileage??'';$('status').value=c?.status||'open';$('notes').value=c?.notes||'';show('caseMsg','');$('caseDialog').showModal()}
$('saveCase').onclick=async e=>{e.preventDefault();const id=$('caseId').value,body={group_id:SHOP.id,plate:$('plate').value.trim().toUpperCase()||null,vin:$('vin').value.trim().toUpperCase()||null,vehicle:$('vehicle').value.trim()||null,customer_name:$('customer').value.trim()||null,mileage:$('mileage').value?Number($('mileage').value):null,status:$('status').value,notes:$('notes').value.trim()||null};if(!body.plate&&!body.vin)return show('caseMsg','Kennzeichen oder VIN ist erforderlich.',true);try{if(id)await api('/rest/v1/workshop_cases?id=eq.'+id,{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(body)});else await api('/rest/v1/workshop_cases',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({...body,created_by:USER.id})});$('caseDialog').close();await loadCases();if(id&&body.status==='closed'&&!SHOW_ARCHIVE){CURRENT=null;$('detailView').classList.add('hidden');$('listView').classList.remove('hidden');renderCases()}else if(id&&CURRENT){CURRENT=CASES.find(x=>x.id===id);renderDetail()}}catch(x){show('caseMsg',x.message,true)}}
async function openCase(id){CURRENT=CASES.find(c=>c.id===id);$('listView').classList.add('hidden');$('detailView').classList.remove('hidden');renderDetail();await loadFiles()}function renderDetail(){$('downloadCase').classList.toggle('hidden',CURRENT.status!=='closed');$('detailPlate').textContent=CURRENT.plate||'OHNE KENNZEICHEN';$('detailVehicle').textContent=CURRENT.vehicle||CURRENT.vin||'';$('caseInfo').innerHTML=kv('Fahrgestellnummer',CURRENT.vin||'–')+kv('Kilometerstand',CURRENT.mileage!=null?Number(CURRENT.mileage).toLocaleString('de-DE')+' km':'–')+kv('Fahrzeug',CURRENT.vehicle||'–')+kv('Kunde',CURRENT.customer_name||'–')+kvStatus(CURRENT.status)+kv('Notizen',CURRENT.notes||'Keine Notizen vorhanden.','wide')}function kv(k,v,cls=''){return'<div class="kv '+cls+'"><b>'+k+'</b><span>'+esc(v)+'</span></div>'}function kvStatus(s){return'<div class="kv"><b>Status</b><span class="detailStatus '+esc(s)+'">'+esc(statusText(s))+'</span></div>'}
$('back').onclick=()=>{$('detailView').classList.add('hidden');$('listView').classList.remove('hidden');CURRENT=null;loadCases()};$('editCase').onclick=()=>openCaseForm(CURRENT);$('addNote').onclick=()=>openCaseForm(CURRENT);$('refreshFiles').onclick=loadFiles;
async function signed(path,expires=900){const j=await api('/storage/v1/object/sign/workshop-files/'+enc(path),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expiresIn:expires})});let s=j.signedURL||j.signedUrl||j.signed_url;return s.startsWith('/')?U+'/storage/v1'+s:s}
async function loadFiles(){try{const a=await api('/rest/v1/workshop_case_files?select=*&case_id=eq.'+CURRENT.id+'&order=created_at.desc');CURRENT_FILES=a;$('fileCount').textContent=a.length+' Dateien';const cards=[];for(const f of a){let url='';if((f.mime_type||'').startsWith('image/'))try{url=await signed(f.storage_path)}catch{}cards.push('<article class="file">'+(url?'<img src="'+attr(url)+'" alt="">':'<div class="fileIcon">'+fileIcon(f)+'</div>')+'<div class="filebody"><span class="category">'+categoryText(f.category)+'</span><b>'+esc(f.original_name)+'</b><small>'+bytes(f.size_bytes)+' · '+new Date(f.created_at).toLocaleDateString('de-DE')+'</small><button class="secondary" data-path="'+attr(f.storage_path)+'" data-name="'+attr(f.original_name)+'">ÖFFNEN</button></div></article>')}$('filesGrid').innerHTML=cards.length?cards.join(''):'<div class="empty"><b>Noch keine Dateien</b>Fotografiere das Fahrzeug oder füge Dokumente und Logs hinzu.</div>';$('filesGrid').querySelectorAll('button').forEach(b=>b.onclick=()=>download(b.dataset.path,b.dataset.name))}catch(x){$('filesGrid').innerHTML='<div class="empty">'+esc(x.message)+'</div>'}}
function choose(files){PENDING=[...files].filter(f=>f.size<=104857600);if(!PENDING.length)return alert('Keine gültigen Dateien bis 100 MB ausgewählt.');$('selectedFiles').textContent=PENDING.length+' Datei(en): '+PENDING.map(f=>f.name).join(', ');$('uploadForm').reset();$('uploadDialog').showModal()}$('cameraInput').onchange=e=>choose(e.target.files);$('fileInput').onchange=e=>choose(e.target.files);
$('uploadNow').onclick=async e=>{e.preventDefault();const b=$('uploadNow');b.disabled=true;show('uploadMsg','Upload läuft …');let done=0;for(const f of PENDING){const clean=f.name.replace(/[^A-Za-z0-9._ -]/g,'_').slice(0,140),path=SHOP.id+'/'+CURRENT.id+'/'+USER.id+'/'+crypto.randomUUID()+'_'+clean;try{let r=await fetch(U+'/storage/v1/object/workshop-files/'+enc(path),{method:'POST',headers:{...headers(),'Content-Type':f.type||'application/octet-stream','x-upsert':'false'},body:f});if(!r.ok)throw Error(await r.text());await api('/rest/v1/workshop_case_files',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({case_id:CURRENT.id,group_id:SHOP.id,uploader_id:USER.id,storage_path:path,original_name:f.name,mime_type:f.type||null,size_bytes:f.size,category:$('category').value,note:$('fileNote').value.trim()||null})});done++}catch(x){show('uploadMsg',f.name+': '+x.message,true)}}b.disabled=false;if(done){$('uploadDialog').close();PENDING=[];await loadFiles();await loadCases()}}
async function downloadCaseZip(){
 if(!CURRENT||CURRENT.status!=='closed')return;
 if(!CURRENT.vin)return alert('Bitte zuerst die Fahrgestellnummer in der Fahrzeugakte ergänzen.');
 if(typeof JSZip==='undefined')return alert('ZIP-Funktion konnte nicht geladen werden.');
 const btn=$('downloadCase'),old=btn.textContent;btn.disabled=true;
 try{
  const clean=s=>String(s||'').replace(/[\\/:*?"<>|]/g,'_').trim()||'Datei';
  const vin=clean(CURRENT.vin.toUpperCase()),zip=new JSZip(),root=zip.folder(vin);
  const info=[
   'WERKSTATT TOOL – FAHRZEUGAKTE','',
   'Fahrgestellnummer: '+(CURRENT.vin||'–'),
   'Kennzeichen: '+(CURRENT.plate||'–'),
   'Fahrzeug: '+(CURRENT.vehicle||'–'),
   'Kunde: '+(CURRENT.customer_name||'–'),
   'Kilometerstand: '+(CURRENT.mileage!=null?CURRENT.mileage+' km':'–'),
   'Status: '+statusText(CURRENT.status),
   'Erstellt: '+new Date(CURRENT.created_at).toLocaleString('de-DE'),
   'Abgeschlossen / zuletzt geändert: '+new Date(CURRENT.updated_at).toLocaleString('de-DE'),
   'Werkstatt: '+SHOP.name,'',
   'NOTIZEN','-------',CURRENT.notes||'Keine Notizen.'
  ].join('\r\n');
  root.file('00_Fahrzeugakte.txt',info);
  const folders={handover:'01_Fahrzeuguebergabe',damage:'02_Schaeden',work:'03_Arbeitsdokumentation',new_part:'04_Neuteile',vcds:'05_VCDS-Logs',document:'06_Dokumente',other:'07_Sonstiges'};
  const list=['Nr.;Kategorie;Dateiname;Datum;Groesse;Notiz'];
  for(let i=0;i<CURRENT_FILES.length;i++){
   const f=CURRENT_FILES[i],folder=folders[f.category]||folders.other;
   btn.textContent='DATEI '+(i+1)+' VON '+CURRENT_FILES.length;
   const url=await signed(f.storage_path,300),r=await fetch(url);if(!r.ok)throw Error('Datei konnte nicht geladen werden: '+f.original_name);
   const data=await r.arrayBuffer(),name=String(i+1).padStart(3,'0')+'_'+clean(f.original_name);
   root.folder(folder).file(name,data,{binary:true});
   const csv=x=>'"'+String(x??'').replace(/"/g,'""')+'"';
   list.push([i+1,categoryText(f.category),f.original_name,new Date(f.created_at).toLocaleString('de-DE'),f.size_bytes,f.note||''].map(csv).join(';'));
  }
  root.file('00_Dateiliste.csv','\uFEFF'+list.join('\r\n'));
  btn.textContent='ZIP WIRD ERSTELLT …';
  const blob=await zip.generateAsync({type:'blob',compression:'STORE',platform:'DOS'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=vin+'.zip';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
 }catch(x){alert('Export fehlgeschlagen: '+x.message)}finally{btn.disabled=false;btn.textContent=old}
}
$('downloadCase').onclick=downloadCaseZip;

function signout(){clearSession();location.reload()}$('signout').onclick=signout;function statusText(s){return({open:'Offen',in_progress:'In Arbeit',waiting:'Wartet',ready:'Fertig',closed:'Abgeschlossen'})[s]||s}function categoryText(s){return({handover:'Übergabe',damage:'Schaden',work:'Arbeit',new_part:'Neuteil',vcds:'VCDS-Log',document:'Dokument',other:'Sonstiges'})[s]||s}function fileIcon(f){if((f.mime_type||'').includes('pdf'))return'PDF';if(f.category==='vcds')return'LOG';return'DATEI'}function bytes(n){return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,n/1024).toFixed(0)+' KB'}function enc(p){return p.split('/').map(encodeURIComponent).join('/')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function attr(s){return esc(s)}
