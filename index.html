<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VAG Toolbox by Lukas Kopper</title><style>*{box-sizing:border-box}html,body{margin:0;background:#01050b;min-height:100%;font-family:Arial,Helvetica,sans-serif}body{display:flex;justify-content:center;overflow-x:hidden}.frame{position:relative;width:min(1024px,100vw);min-height:100vh;background:#020817 url('vag-toolbox-hero.svg') center top/cover no-repeat}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(1,7,18,.1),rgba(1,7,18,.78));pointer-events:none}.ui{position:relative;z-index:2;min-height:100vh;padding:56vh 7% 45px}.card{max-width:720px;margin:auto;padding:30px 7%;border:1px solid #159cff;border-radius:22px;background:rgba(3,15,28,.94);box-shadow:0 0 50px rgba(0,137,255,.18),0 25px 80px #0009}.lock{width:60px;height:60px;margin:0 auto 12px;border:2px solid #14a0ff;border-radius:50%;display:grid;place-items:center;font-size:27px}.title{text-align:center;font-size:30px;font-weight:800;color:#f4f9ff}.by{text-align:center;color:#19a1ff;font-size:22px;font-style:italic;font-weight:700;margin:4px 0}.sub{text-align:center;color:#a9bed0;margin-bottom:18px}.notice{border:1px solid #29445e;background:#07182a;border-radius:9px;padding:10px;color:#b9cbdb;text-align:center;font-size:13px;margin-bottom:16px}.tabs{display:flex;gap:10px}.tabs button{flex:1;padding:13px;border-radius:9px;border:1px solid #24435e;background:#0a1c2e;color:#c8d8e7;font-weight:700;font-size:15px}.tabs .active{background:linear-gradient(90deg,#075fe9,#12a2ff);color:#fff;border-color:#159cff}label{display:block;font-weight:700;font-size:14px;color:#dceafa;margin:12px 0 6px}input{width:100%;padding:13px;border-radius:9px;border:1px solid #35526b;background:#071523;color:#fff;font-size:16px;outline:none}input:focus{border-color:#159cff}.primary{width:100%;margin-top:17px;padding:14px;border:0;border-radius:9px;background:linear-gradient(90deg,#075fe9,#12a2ff);color:#fff;font-size:17px;font-weight:800}.msg{display:none;margin-top:13px;padding:11px;border-radius:9px;background:#0b2034;color:#dceafa;text-align:center;font-size:13px}.small,.note{text-align:center;color:#91a8bb;font-size:12px;margin-top:14px}.note{color:#71899c;margin-top:18px}@media(max-width:600px){.ui{padding:54vh 12px 25px}.card{padding:23px 18px}.title{font-size:26px}.by{font-size:19px}}
</style></head><body><div class="frame"><div class="shade"></div><div class="ui"><section class="card"><div class="lock">🔒</div><div class="title">VAG Toolbox</div><div class="by">by Lukas Kopper</div><div class="sub">Geschützter Mitgliederbereich</div><div class="notice">🛡 Zugang nur nach Registrierung und individueller Freischaltung.</div><div class="tabs"><button id="loginTab" class="active" type="button">ANMELDEN</button><button id="regTab" type="button">REGISTRIEREN</button></div><form id="form"><label>E-Mail-Adresse</label><input id="email" type="email" required autocomplete="email" placeholder="Deine E-Mail-Adresse"><label>Passwort</label><input id="password" type="password" required minlength="8" autocomplete="current-password" placeholder="Dein Passwort"><button class="primary" type="submit" id="submit">➜ &nbsp; ANMELDEN</button></form><div id="msg" class="msg"></div><div class="small">Neue Konten werden erst nach manueller Freischaltung für die Toolbox aktiviert.</div><div class="note">Entwicklung und Programmierung von Lukas Kopper / l.kopper16@gmail.com</div></section></div></div><script>const URL='https://mjvqdhclkqgrvqfaafzp.supabase.co',KEY='sb_publishable_H4rBbPLak0JM-9pU2ympmw_sK9Wc1En';let m='login';const $=id=>document.getElementById(id),msg=$('msg');function show(t){msg.textContent=t;msg.style.display='block'}function mode(x){m=x;$('loginTab').classList.toggle('active',x==='login');$('regTab').classList.toggle('active',x==='register');$('submit').textContent=x==='login'?'➜  ANMELDEN':'➜  REGISTRIEREN';$('password').autocomplete=x==='login'?'current-password':'new-password';msg.style.display='none'}$('loginTab').onclick=()=>mode('login');$('regTab').onclick=()=>mode('register');async function api(path,opts={}){const r=await fetch(URL+path,{...opts,headers:{apikey:KEY,'Content-Type':'application/json',...(opts.headers||{})}});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.msg||j.message||j.error_description||j.error||('HTTP '+r.status));return j}async function saveMember(token,id,email){const r=await fetch(URL+'/rest/v1/mk100_members?on_conflict=user_id',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:id,email,is_active:false,status:'pending'})});return r.ok}async function getMember(token,id){const r=await fetch(URL+'/rest/v1/mk100_members?select=status,is_active&user_id=eq.'+encodeURIComponent(id),{headers:{apikey:KEY,Authorization:'Bearer '+token}});if(!r.ok)return null;const a=await r.json();return a[0]||null}function saveToken(t){sessionStorage.setItem('mk100_token',t);localStorage.setItem('mk100_token',t)}$('form').onsubmit=async e=>{e.preventDefault();const email=$('email').value.trim().toLowerCase(),password=$('password').value,btn=$('submit');btn.disabled=true;show('Bitte warten …');try{if(m==='register'){const d=await api('/auth/v1/signup',{method:'POST',body:JSON.stringify({email,password})});if(!d.user)throw new Error('Registrierung konnte nicht abgeschlossen werden.');if(d.access_token){saveToken(d.access_token);await saveMember(d.access_token,d.user.id,email)}show(d.access_token?'Registrierung erfolgreich. Dein Zugang muss jetzt noch freigeschaltet werden.':'Registrierung erfolgreich. Bitte bestätige zuerst deine E-Mail. Danach kannst du dich anmelden.');return}const d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});if(!d.access_token||!d.user)throw new Error('Anmeldung fehlgeschlagen.');saveToken(d.access_token);const member=await getMember(d.access_token,d.user.id);if(!member){if(await saveMember(d.access_token,d.user.id,email))show('Dein Zugang wartet noch auf die Freischaltung.');else show('Der Zugang konnte nicht geprüft werden.');return}if(member.status==='approved'&&member.is_active===true){location.replace('rechner.html?v='+Date.now());return}show(member.status==='blocked'?'Dein Zugang wurde gesperrt.':member.status==='rejected'?'Dein Zugang wurde abgelehnt.':'Dein Zugang wartet noch auf die Freischaltung.')}catch(err){show(err.message||'Anmeldung fehlgeschlagen.')}finally{btn.disabled=false}};</script></body></html>
