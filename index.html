<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VAG Toolbox</title><style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01050b;font-family:Arial,Helvetica,sans-serif;color:#fff}
.page{position:relative;width:100vw;height:100dvh;min-height:560px;background:#01050b url('vag-toolbox-login.jpg?v=21') center/cover no-repeat}
.login{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(600px,48vw);padding:24px 28px 20px;background:rgba(2,14,27,.88);border:1px solid rgba(34,104,151,.75);border-radius:18px;box-shadow:0 18px 55px rgba(0,0,0,.45);backdrop-filter:blur(5px)}
.brand{text-align:center;margin-bottom:18px}.lock{width:44px;height:44px;margin:0 auto 8px;border:2px solid #11a9ff;border-radius:50%;display:grid;place-items:center;font-size:22px;box-shadow:0 0 18px rgba(0,157,255,.28)}
h1{font-size:34px;margin:0 0 2px;font-weight:800;letter-spacing:-.8px}.by{font-size:18px;font-weight:700;font-style:italic;color:#18a8ff}.sub{font-size:13px;color:#b7c9d8;margin-top:5px}
.tabs{display:flex;gap:8px;margin-bottom:15px}.tabs button{flex:1;height:42px;border:1px solid rgba(47,99,135,.75);background:rgba(8,28,45,.9);color:#dcecff;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer}.tabs .active{background:linear-gradient(90deg,#0878ed,#0ba6ff);border-color:#19aaff;color:white}
.field{margin-bottom:11px}.field label{display:block;font-size:13px;font-weight:700;margin:0 0 5px;color:#e8f4ff}.field input{width:100%;height:44px;border:1px solid rgba(100,137,165,.9);border-radius:8px;background:#edf4ff;color:#101820;padding:0 13px;font-size:15px;outline:none}
.primary{width:100%;height:45px;border:0;border-radius:8px;background:linear-gradient(90deg,#0878ed,#0ba6ff);color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-top:1px}.primary:disabled{opacity:.65}
.msg{display:none;margin-top:8px;padding:8px;border-radius:7px;background:rgba(6,24,41,.96);border:1px solid #24506f;color:#d9efff;text-align:center;font-size:12px}.small{margin-top:9px;text-align:center;color:#a8bdcd;font-size:11px;line-height:1.3}.note{margin-top:8px;text-align:center;color:#8198aa;font-size:10px}
@media(max-width:900px){.page{background-size:auto 100%;background-position:center}.login{width:min(600px,78vw)}}@media(max-width:600px){.page{background-size:auto 100%;background-position:center}.login{width:calc(100vw - 28px);padding:18px 18px 15px;border-radius:15px}.brand{margin-bottom:13px}.lock{width:38px;height:38px;font-size:19px;margin-bottom:5px}h1{font-size:28px}.by{font-size:16px}.sub{font-size:12px}.tabs{margin-bottom:11px}.tabs button{height:39px;font-size:13px}.field{margin-bottom:8px}.field label{font-size:12px}.field input{height:39px;font-size:14px}.primary{height:40px;font-size:15px}.small{font-size:9px}.note{font-size:8.5px}}
</style></head><body><div class="page"><main class="login"><div class="brand"><div class="lock">🔒</div><h1>VAG Toolbox</h1><div class="by">Diagnose &amp; Codierung</div><div class="sub">Geschützter Mitgliederbereich</div></div><div class="tabs"><button id="loginTab" class="active" type="button">Anmelden</button><button id="regTab" type="button">Registrieren</button></div><form id="form"><div class="field"><label for="email">E-Mail</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label for="password">Passwort</label><input id="password" type="password" required minlength="8" autocomplete="current-password"></div><button class="primary" type="submit" id="submit">ANMELDEN</button></form><div id="msg" class="msg"></div><div class="small">Neue Konten werden erst nach manueller Freischaltung für die Toolbox aktiviert.</div><div class="note">VAG Toolbox</div></main></div><script>
const URL='https://mjvqdhclkqgrvqfaafzp.supabase.co';
const KEY='sb_publishable_H4rBbPLak0JM-9pU2ympmw_sK9Wc1En';
let m='login';
const $=id=>document.getElementById(id),msg=$('msg');

function show(t){msg.textContent=t;msg.style.display='block'}
function mode(x){
  m=x;
  $('loginTab').classList.toggle('active',x==='login');
  $('regTab').classList.toggle('active',x==='register');
  $('submit').textContent=x==='login'?'ANMELDEN':'REGISTRIEREN';
  $('password').autocomplete=x==='login'?'current-password':'new-password';
  msg.style.display='none';
}
$('loginTab').onclick=()=>mode('login');
$('regTab').onclick=()=>mode('register');

async function api(path,opts={}){
  const r=await fetch(URL+path,{...opts,headers:{apikey:KEY,'Content-Type':'application/json',...(opts.headers||{})}});
  let j={}; try{j=await r.json()}catch{}
  if(!r.ok) throw new Error(j.msg||j.message||j.error_description||j.error||('HTTP '+r.status));
  return j;
}
async function saveMember(token,id,email){
  const r=await fetch(URL+'/rest/v1/mk100_members?on_conflict=user_id',{
    method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},
    body:JSON.stringify({user_id:id,email,is_active:false,status:'pending'})
  });
  return r.ok;
}
async function getMember(token,id){
  const r=await fetch(URL+'/rest/v1/mk100_members?select=status,is_active&user_id=eq.'+encodeURIComponent(id),{
    headers:{apikey:KEY,Authorization:'Bearer '+token}
  });
  if(!r.ok)return null;
  const a=await r.json();
  return a[0]||null;
}
function saveToken(t){
  sessionStorage.setItem('mk100_token',t);
  localStorage.setItem('mk100_token',t);
}

$('form').onsubmit=async e=>{
  e.preventDefault();
  const email=$('email').value.trim().toLowerCase();
  const password=$('password').value;
  const btn=$('submit');
  btn.disabled=true;
  show('Bitte warten …');
  try{
    if(m==='register'){
      const d=await api('/auth/v1/signup',{
        method:'POST',
        body:JSON.stringify({email,password})
      });

      // Supabase can return a user object without a session when email confirmation is enabled.
      // That is still a successful registration.
      if(d.access_token && d.user){
        saveToken(d.access_token);
        await saveMember(d.access_token,d.user.id,email);
        show('Registrierung erfolgreich. Dein Zugang muss jetzt noch freigeschaltet werden.');
        return;
      }

      if(d.user){
        show('Registrierung erfolgreich. Bitte bestätige zuerst deine E-Mail. Danach kannst du dich anmelden und auf Freischaltung warten.');
        return;
      }

      // Some Supabase configurations intentionally return no user details for existing accounts.
      show('Registrierung wurde angenommen. Falls die E-Mail noch nicht registriert war, prüfe bitte dein Postfach und melde dich danach an.');
      return;
    }

    const d=await api('/auth/v1/token?grant_type=password',{
      method:'POST',
      body:JSON.stringify({email,password})
    });

    if(!d.access_token||!d.user)throw new Error('Anmeldung fehlgeschlagen.');
    saveToken(d.access_token);

    const member=await getMember(d.access_token,d.user.id);
    if(!member){
      if(await saveMember(d.access_token,d.user.id,email))
        show('Dein Zugang wartet noch auf die Freischaltung.');
      else
        show('Der Zugang konnte nicht geprüft werden.');
      return;
    }

    if(member.status==='approved'&&member.is_active===true){
      location.replace('toolbox.html?v='+Date.now());
      return;
    }

    show(
      member.status==='blocked'?'Dein Zugang wurde gesperrt.':
      member.status==='rejected'?'Dein Zugang wurde abgelehnt.':
      'Dein Zugang wartet noch auf die Freischaltung.'
    );
  }catch(err){
    const t=(err.message||'').toLowerCase();
    if(m==='register' && (t.includes('already registered')||t.includes('already exists')||t.includes('user already registered'))){
      show('Diese E-Mail-Adresse ist bereits registriert. Bitte melde dich an.');
    }else if(m==='register' && t.includes('password')){
      show('Das Passwort erfüllt die Anforderungen nicht. Bitte verwende mindestens 8 Zeichen.');
    }else{
      show(err.message||'Vorgang fehlgeschlagen.');
    }
  }finally{
    btn.disabled=false;
  }
};
</script></body></html>
