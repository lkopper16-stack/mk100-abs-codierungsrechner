<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VAG Toolbox by Lukas Kopper</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01050b;font-family:Arial,Helvetica,sans-serif}body{color:#fff}.page{position:relative;width:100vw;height:100vh;min-height:620px;background:#01050b url('vag-toolbox-login.jpg?v=15') center center/cover no-repeat}.overlay{position:absolute;inset:0;pointer-events:none}.login{position:absolute;left:50%;top:54.5%;transform:translate(-50%,-50%);width:min(640px,52vw);padding:0 28px;pointer-events:auto}.tabs{display:flex;gap:8px;height:43px;margin-bottom:12px}.tabs button{flex:1;border:1px solid rgba(42,99,145,.65);background:rgba(3,17,31,.78);color:#e8f4ff;border-radius:7px;font-size:15px;font-weight:700;cursor:pointer}.tabs .active{background:linear-gradient(90deg,#0878ed,#0ba6ff);border-color:#19aaff}.field{position:relative;margin-bottom:10px}.field input{width:100%;height:43px;border:1px solid rgba(64,103,136,.8);border-radius:6px;background:rgba(10,28,45,.88);color:#fff;padding:0 15px;font-size:15px;outline:none}.field input:focus{border-color:#16a8ff;box-shadow:0 0 0 2px rgba(22,168,255,.18)}.primary{width:100%;height:44px;border:0;border-radius:7px;background:linear-gradient(90deg,#0878ed,#0ba6ff);color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-top:1px}.primary:disabled{opacity:.65}.msg{display:none;margin-top:8px;padding:8px;border-radius:6px;background:rgba(6,24,41,.94);border:1px solid #24506f;color:#d9efff;text-align:center;font-size:12px}.small{margin-top:8px;text-align:center;color:#9fb6c8;font-size:11px}.note{margin-top:9px;text-align:center;color:#8399aa;font-size:10px}@media(max-width:800px){.page{background-size:auto 100%;background-position:center top}.login{top:60%;width:min(94vw,560px);padding:0 18px}.tabs{height:40px}.tabs button{font-size:13px}.field input{height:40px;font-size:14px}.primary{height:41px;font-size:15px}.small{font-size:10px}.note{font-size:9px}}@media(max-width:500px){.page{background-size:auto 100%;}.login{top:62%;padding:0 12px}.tabs{height:38px;margin-bottom:8px}.field{margin-bottom:7px}.field input{height:37px}.primary{height:38px}.small,.note{font-size:9px}}</style></head><body><div class="page"><div class="overlay"><main class="login"><div class="tabs"><button id="loginTab" class="active" type="button">ANMELDEN</button><button id="regTab" type="button">REGISTRIEREN</button></div><form id="form"><div class="field"><input id="email" type="email" required autocomplete="email" aria-label="E-Mail-Adresse"></div><div class="field"><input id="password" type="password" required minlength="8" autocomplete="current-password" aria-label="Passwort"></div><button class="primary" type="submit" id="submit">ANMELDEN</button></form><div id="msg" class="msg"></div><div class="small">Neue Konten werden erst nach manueller Freischaltung für die Toolbox aktiviert.</div><div class="note">Entwicklung und Programmierung von Lukas Kopper / l.kopper16@gmail.com</div></main></div></div><script>const URL='https://mjvqdhclkqgrvqfaafzp.supabase.co',KEY='sb_publishable_H4rBbPLak0JM-9pU2ympmw_sK9Wc1En';let m='login';const $=id=>document.getElementById(id),msg=$('msg');function show(t){msg.textContent=t;msg.style.display='block'}function mode(x){m=x;$('loginTab').classList.toggle('active',x==='login');$('regTab').classList.toggle('active',x==='register');$('submit').textContent=x==='login'?'ANMELDEN':'REGISTRIEREN';$('password').autocomplete=x==='login'?'current-password':'new-password';msg.style.display='none'}$('loginTab').onclick=()=>mode('login');$('regTab').onclick=()=>mode('register');async function api(path,opts={}){const r=await fetch(URL+path,{...opts,headers:{apikey:KEY,'Content-Type':'application/json',...(opts.headers||{})}});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.msg||j.message||j.error_description||j.error||('HTTP '+r.status));return j}async function saveMember(token,id,email){const r=await fetch(URL+'/rest/v1/mk100_members?on_conflict=user_id',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:id,email,is_active:false,status:'pending'})});return r.ok}async function getMember(token,id){const r=await fetch(URL+'/rest/v1/mk100_members?select=status,is_active&user_id=eq.'+encodeURIComponent(id),{headers:{apikey:KEY,Authorization:'Bearer '+token}});if(!r.ok)return null;const a=await r.json();return a[0]||null}function saveToken(t){sessionStorage.setItem('mk100_token',t);localStorage.setItem('mk100_token',t)}$('form').onsubmit=async e=>{e.preventDefault();const email=$('email').value.trim().toLowerCase(),password=$('password').value,btn=$('submit');btn.disabled=true;show('Bitte warten …');try{if(m==='register'){const d=await api('/auth/v1/signup',{method:'POST',body:JSON.stringify({email,password})});if(!d.user)throw new Error('Registrierung konnte nicht abgeschlossen werden.');if(d.access_token){saveToken(d.access_token);await saveMember(d.access_token,d.user.id,email)}show(d.access_token?'Registrierung erfolgreich. Dein Zugang muss jetzt noch freigeschaltet werden.':'Registrierung erfolgreich. Bitte bestätige zuerst deine E-Mail. Danach kannst du dich anmelden.');return}const d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});if(!d.access_token||!d.user)throw new Error('Anmeldung fehlgeschlagen.');saveToken(d.access_token);const member=await getMember(d.access_token,d.user.id);if(!member){if(await saveMember(d.access_token,d.user.id,email))show('Dein Zugang wartet noch auf die Freischaltung.');else show('Der Zugang konnte nicht geprüft werden.');return}if(member.status==='approved'&&member.is_active===true){location.replace('rechner.html?v='+Date.now());return}show(member.status==='blocked'?'Dein Zugang wurde gesperrt.':member.status==='rejected'?'Dein Zugang wurde abgelehnt.':'Dein Zugang wartet noch auf die Freischaltung.')}catch(err){show(err.message||'Anmeldung fehlgeschlagen.')}finally{btn.disabled=false}};</script></body></html>
