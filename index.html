<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MK100 ABS Codierungsrechner</title><style>body{font-family:Arial,sans-serif;background:#eef1f5;margin:0;padding:20px;color:#17202a}.box{max-width:520px;margin:6vh auto;background:#fff;padding:30px;border-radius:18px;box-shadow:0 10px 35px #0002}.brand{display:flex;gap:14px;align-items:center}.logo{width:48px;height:48px;border-radius:13px;background:linear-gradient(135deg,#155eef,#7f56d9);display:grid;place-items:center;color:white;font-weight:800}.sub{color:#667085;margin:6px 0 24px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button{flex:1;background:#eef2f6;color:#344054}.tabs button.active{background:#155eef;color:white}label{display:block;font-size:13px;font-weight:bold;margin-top:12px}input{width:100%;padding:12px;margin-top:5px;border:1px solid #b8c0cc;border-radius:9px;font-size:15px;box-sizing:border-box}button{border:0;border-radius:9px;padding:12px 16px;font-weight:bold;cursor:pointer}.primary{width:100%;background:#155eef;color:white;font-size:15px;margin-top:18px}.primary:disabled{opacity:.65}.msg{margin-top:14px;padding:11px;border-radius:9px;background:#f6f7f9;font-size:13px;display:none}.note{margin-top:22px;font-size:12px;color:#98a2b3;text-align:center}.small{font-size:12px;color:#667085;margin-top:8px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="box"><div class="brand"><div class="logo">ABS</div><div><h1 style="margin:0">MK100 ABS Codierungsrechner</h1><div class="sub">Geschützter Mitgliederbereich</div></div></div><div class="tabs"><button id="loginTab" class="active" type="button">Anmelden</button><button id="regTab" type="button">Registrieren</button></div><form id="form"><label>E-Mail<input id="email" type="email" required autocomplete="email"></label><label>Passwort<input id="password" type="password" required minlength="8" autocomplete="current-password"></label><button class="primary" type="submit" id="submit">ANMELDEN</button></form><div id="msg" class="msg"></div><div class="small">Neue Konten werden erst nach manueller Freischaltung für den Rechner aktiviert.</div><div class="note">Entwicklung und Programmierung von Lukas Kopper / l.kopper16@gmail.com</div></div><script>const SUPA_URL='https://mjvqdhclkqgrvqfaafzp.supabase.co';const SUPA_KEY='sb_publishable_H4rBbPLak0JM-9pU2ympmw_sK9Wc1En';let sb=null,m='login';const $=id=>document.getElementById(id),msg=$('msg');function show(t){msg.textContent=t;msg.style.display='block'}function mode(x){m=x;$('loginTab').classList.toggle('active',x==='login');$('regTab').classList.toggle('active',x==='register');$('submit').textContent=x==='login'?'ANMELDEN':'REGISTRIEREN';$('password').autocomplete=x==='login'?'current-password':'new-password';msg.style.display='none'}$('loginTab').onclick=()=>mode('login');$('regTab').onclick=()=>mode('register');window.addEventListener('load',()=>{if(!window.supabase){show('Der Anmeldedienst konnte nicht geladen werden. Bitte Seite neu laden.')}else{sb=window.supabase.createClient(SUPA_URL,SUPA_KEY)}});$('form').onsubmit=async e=>{e.preventDefault();if(!sb){show('Anmeldedienst nicht verfügbar. Bitte Seite neu laden.');return}const email=$('email').value.trim().toLowerCase(),password=$('password').value;const btn=$('submit');btn.disabled=true;show('Bitte warten …');try{if(m==='register'){const{data,error}=await sb.auth.signUp({email,password});if(error)throw error;if(data.user){await sb.from('mk100_members').upsert({user_id:data.user.id,email,is_active:false,status:'pending'},{onConflict:'user_id'});show('Registrierung erfolgreich. Dein Zugang muss jetzt noch freigeschaltet werden.');}return}const{data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;await sb.from('mk100_members').upsert({user_id:data.user.id,email,is_active:false,status:'pending'},{onConflict:'user_id',ignoreDuplicates:true});const r=await fetch(SUPA_URL+'/functions/v1/mk100-access',{headers:{Authorization:'Bearer '+data.session.access_token}});const a=await r.json();if(a.allowed){location.href='rechner.html';return}await sb.auth.signOut();show(a.reason==='pending'?'Dein Zugang wartet noch auf die Freischaltung.':a.reason==='blocked'?'Dein Zugang wurde gesperrt.':'Dein Zugang ist derzeit nicht freigeschaltet.')}catch(err){show(err&&err.message?err.message:'Anmeldung fehlgeschlagen.')}finally{btn.disabled=false}};</script></body></html>
