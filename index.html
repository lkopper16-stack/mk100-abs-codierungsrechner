<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VAG Toolbox by Lukas Kopper</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;min-height:100vh;color:#eef6ff;background:#020817 url('vag-toolbox-bg.svg') center top/cover fixed no-repeat}.shade{position:fixed;inset:0;background:linear-gradient(180deg,rgba(1,7,18,.18),rgba(1,7,18,.68));z-index:0}.wrap{position:relative;z-index:1;min-height:100vh;display:flex;align-items:flex-end;justify-content:center;padding:32px 18px 42px}.box{width:min(520px,100%);padding:28px;border:1px solid rgba(76,180,255,.28);border-radius:22px;background:rgba(5,18,32,.86);backdrop-filter:blur(14px);box-shadow:0 18px 70px rgba(0,0,0,.55),0 0 40px rgba(16,141,255,.12)}.brand{text-align:center;margin-bottom:20px}.brand h1{margin:0;font-size:34px;letter-spacing:-1px;color:#f4f9ff}.by{margin-top:4px;color:#29a4ff;font-size:18px;font-weight:700;font-style:italic}.sub{color:#a9c2d8;margin-top:7px;font-size:13px}.lock{width:52px;height:52px;margin:0 auto 12px;border:2px solid #1697ff;border-radius:50%;display:grid;place-items:center;font-size:24px;box-shadow:0 0 22px rgba(22,151,255,.35)}.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button{flex:1;background:#102438;color:#c9d8e7;border:1px solid #24435d}.tabs button.active{background:#087df0;color:white;border-color:#159cff}label{display:block;font-size:13px;font-weight:bold;margin-top:12px;color:#dceafa}input{width:100%;padding:13px;margin-top:6px;border:1px solid #36536b;background:#0a1a2b;color:#fff;border-radius:10px;font-size:15px;outline:none}input:focus{border-color:#159cff;box-shadow:0 0 0 3px rgba(21,156,255,.12)}button{border:0;border-radius:10px;padding:12px 16px;font-weight:bold;cursor:pointer}.primary{width:100%;background:linear-gradient(90deg,#075fe9,#12a2ff);color:white;font-size:15px;margin-top:18px}.primary:disabled{opacity:.65}.msg{margin-top:14px;padding:11px;border-radius:9px;background:#102235;color:#d8e8f7;font-size:13px;display:none}.small{font-size:12px;color:#91a9bd;margin-top:13px;text-align:center}.note{margin-top:20px;font-size:12px;color:#7890a5;text-align:center}@media(max-width:600px){body{background-position:center top}.wrap{align-items:flex-end;padding:18px 12px 24px}.box{padding:22px 18px}.brand h1{font-size:28px}.by{font-size:16px}}</style></head><body><div class="shade"></div><main class="wrap"><section class="box"><div class="brand"><div class="lock">🔒</div><h1>VAG Toolbox</h1><div class="by">by Lukas Kopper</div><div class="sub">Geschützter Mitgliederbereich</div></div><div class="tabs"><button id="loginTab" class="active" type="button">Anmelden</button><button id="regTab" type="button">Registrieren</button></div><form id="form"><label>E-Mail<input id="email" type="email" required autocomplete="email"></label><label>Passwort<input id="password" type="password" required minlength="8" autocomplete="current-password"></label><button class="primary" type="submit" id="submit">ANMELDEN</button></form><div id="msg" class="msg"></div><div class="small">Neue Konten werden erst nach manueller Freischaltung für die Toolbox aktiviert.</div><div class="note">Entwicklung und Programmierung von Lukas Kopper / l.kopper16@gmail.com</div></section></main><script>const URL='https://mjvqdhclkqgrvqfaafzp.supabase.co',KEY='sb_publishable_H4rBbPLak0JM-9pU2ympmw_sK9Wc1En';let m='login';const $=id=>document.getElementById(id),msg=$('msg');function show(t){msg.textContent=t;msg.style.display='block'}function mode(x){m=x;$('loginTab').classList.toggle('active',x==='login');$('regTab').classList.toggle('active',x==='register');$('submit').textContent=x==='login'?'ANMELDEN':'REGISTRIEREN';$('password').autocomplete=x==='login'?'current-password':'new-password';msg.style.display='none'}$('loginTab').onclick=()=>mode('login');$('regTab').onclick=()=>mode('register');async function api(path,opts={}){const r=await fetch(URL+path,{...opts,headers:{apikey:KEY,'Content-Type':'application/json',...(opts.headers||{})}});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.msg||j.message||j.error_description||j.error||('HTTP '+r.status));return j}async function saveMember(token,id,email){const r=await fetch(URL+'/rest/v1/mk100_members?on_conflict=user_id',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:id,email,is_active:false,status:'pending'})});return r.ok}async function getMember(token,id){const r=await fetch(URL+'/rest/v1/mk100_members?select=status,is_active&user_id=eq.'+encodeURIComponent(id),{headers:{apikey:KEY,Authorization:'Bearer '+token}});if(!r.ok)return null;const a=await r.json();return a[0]||null}function saveToken(t){sessionStorage.setItem('mk100_token',t);localStorage.setItem('mk100_token',t)}$('form').onsubmit=async e=>{e.preventDefault();const email=$('email').value.trim().toLowerCase(),password=$('password').value,btn=$('submit');btn.disabled=true;show('Bitte warten …');try{if(m==='register'){const d=await api('/auth/v1/signup',{method:'POST',body:JSON.stringify({email,password})});if(!d.user)throw new Error('Registrierung konnte nicht abgeschlossen werden.');if(d.access_token){saveToken(d.access_token);await saveMember(d.access_token,d.user.id,email)}show(d.access_token?'Registrierung erfolgreich. Dein Zugang muss jetzt noch freigeschaltet werden.':'Registrierung erfolgreich. Bitte bestätige zuerst deine E-Mail. Danach kannst du dich anmelden.');return}const d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});if(!d.access_token||!d.user)throw new Error('Anmeldung fehlgeschlagen.');saveToken(d.access_token);const member=await getMember(d.access_token,d.user.id);if(!member){if(await saveMember(d.access_token,d.user.id,email))show('Dein Zugang wartet noch auf die Freischaltung.');else show('Der Zugang konnte nicht geprüft werden.');return}if(member.status==='approved'&&member.is_active===true){location.replace('rechner.html?v='+Date.now());return}show(member.status==='blocked'?'Dein Zugang wurde gesperrt.':member.status==='rejected'?'Dein Zugang wurde abgelehnt.':'Dein Zugang wartet noch auf die Freischaltung.')}catch(err){show(err.message||'Anmeldung fehlgeschlagen.')}finally{btn.disabled=false}};</script></body></html>
