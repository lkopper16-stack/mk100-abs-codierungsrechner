<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VAG Toolbox by Lukas Kopper</title><style>*{box-sizing:border-box}html,body{margin:0;background:#01050b;min-height:100%;font-family:Arial,Helvetica,sans-serif}body{display:flex;justify-content:center;overflow-x:hidden}.frame{position:relative;width:min(1024px,100vw);line-height:0}.art{display:block;width:100%;height:auto}.ui{position:absolute;inset:0;line-height:normal}.hit{position:absolute;background:transparent;border:0;padding:0;cursor:pointer}.tab1{left:20.1%;top:56.0%;width:29.5%;height:3.7%}.tab2{left:50.5%;top:56.0%;width:29.5%;height:3.7%}.email{position:absolute;left:20.1%;top:61.8%;width:59.8%;height:3.8%;background:transparent;border:0;outline:0;color:#f3f8ff;font-size:clamp(13px,1.65vw,18px);padding:0 10px}.pass{position:absolute;left:20.1%;top:67.7%;width:59.8%;height:3.8%;background:transparent;border:0;outline:0;color:#f3f8ff;font-size:clamp(13px,1.65vw,18px);padding:0 10px}.submit{left:20.1%;top:74.5%;width:59.8%;height:3.9%}.message{position:absolute;left:20%;top:79.8%;width:60%;color:#dceafa;text-align:center;font-size:clamp(10px,1.25vw,14px);line-height:1.25;display:none}.message.show{display:block}.register-mode .email{top:61.8%}.register-mode .pass{top:67.7%}@media(max-width:600px){.email,.pass{padding:0 7px}}</style></head><body><div class="frame"><img class="art" src="data:image/webp;base64,UklGRiT6owA<embedded-image-data>" alt="VAG Toolbox Login"><div class="ui" id="ui"><button class="hit tab1" id="loginTab" aria-label="Anmelden"></button><button class="hit tab2" id="regTab" aria-label="Registrieren"></button><form id="form"><input class="email" id="email" type="email" required autocomplete="email" aria-label="E-Mail-Adresse"><input class="pass" id="password" type="password" required minlength="8" autocomplete="current-password" aria-label="Passwort"><button class="hit submit" id="submit" type="submit" aria-label="Anmelden"></button></form><div id="msg" class="message"></div></div></div><script>const URL='https://mjvqdhclkqgrvqfaafzp.supabase.co',KEY='sb_publishable_H4rBbPLak0JM-9pU2ympmw_sK9Wc1En';let m='login';const $=id=>document.getElementById(id),ui=$('ui'),msg=$('msg');function show(t){msg.textContent=t;msg.classList.add('show')}function mode(x){m=x;msg.classList.remove('show');ui.classList.toggle('register-mode',x==='register');$('password').autocomplete=x==='login'?'current-password':'new-password'}$('loginTab').onclick=()=>mode('login');$('regTab').onclick=()=>mode('register');async function api(path,opts={}){const r=await fetch(URL+path,{...opts,headers:{apikey:KEY,'Content-Type':'application/json',...(opts.headers||{})}});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.msg||j.message||j.error_description||j.error||('HTTP '+r.status));return j}async function saveMember(token,id,email){const r=await fetch(URL+'/rest/v1/mk100_members?on_conflict=user_id',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:id,email,is_active:false,status:'pending'})});return r.ok}async function getMember(token,id){const r=await fetch(URL+'/rest/v1/mk100_members?select=status,is_active&user_id=eq.'+encodeURIComponent(id),{headers:{apikey:KEY,Authorization:'Bearer '+token}});if(!r.ok)return null;const a=await r.json();return a[0]||null}function saveToken(t){sessionStorage.setItem('mk100_token',t);localStorage.setItem('mk100_token',t)}$('form').onsubmit=async e=>{e.preventDefault();const email=$('email').value.trim().toLowerCase(),password=$('password').value,btn=$('submit');btn.disabled=true;show('Bitte warten …');try{if(m==='register'){const d=await api('/auth/v1/signup',{method:'POST',body:JSON.stringify({email,password})});if(!d.user)throw new Error('Registrierung konnte nicht abgeschlossen werden.');if(d.access_token){saveToken(d.access_token);await saveMember(d.access_token,d.user.id,email)}show(d.access_token?'Registrierung erfolgreich. Dein Zugang muss jetzt noch freigeschaltet werden.':'Registrierung erfolgreich. Bitte bestätige zuerst deine E-Mail. Danach kannst du dich anmelden.');return}const d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});if(!d.access_token||!d.user)throw new Error('Anmeldung fehlgeschlagen.');saveToken(d.access_token);const member=await getMember(d.access_token,d.user.id);if(!member){if(await saveMember(d.access_token,d.user.id,email))show('Dein Zugang wartet noch auf die Freischaltung.');else show('Der Zugang konnte nicht geprüft werden.');return}if(member.status==='approved'&&member.is_active===true){location.replace('rechner.html?v='+Date.now());return}show(member.status==='blocked'?'Dein Zugang wurde gesperrt.':member.status==='rejected'?'Dein Zugang wurde abgelehnt.':'Dein Zugang wartet noch auf die Freischaltung.')}catch(err){show(err.message||'Anmeldung fehlgeschlagen.')}finally{btn.disabled=false}};</script></body></html>
