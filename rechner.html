<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MK100 ABS Codierungsrechner</title><style>*{box-sizing:border-box}body{font-family:Arial;background:#eef1f5;margin:0;color:#17202a}.wrap{max-width:1050px;margin:auto;padding:18px}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:14px;box-shadow:0 3px 16px #0001}h1{margin:0;font-size:26px}h2{font-size:17px;color:#174ea6}.sub{color:#667085;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}label{font-size:13px;font-weight:700}input,select{width:100%;padding:11px;margin-top:5px;border:1px solid #b8c0cc;border-radius:8px;background:#fff}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.checks label{font-weight:400;padding:10px;background:#f6f7f9;border-radius:8px}.checks input{width:auto;margin-right:8px}button{border:0;border-radius:9px;padding:12px 17px;font-weight:700;cursor:pointer;margin-right:8px}.primary{background:#155eef;color:#fff}.result{background:#101828;color:#fff}.code{font:700 25px Consolas;word-break:break-all;margin:10px 0}.err{color:#b42318;font-weight:bold}.footer{text-align:center;color:#98a2b3;font-size:12px;padding:8px}.brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#155eef,#7f56d9);display:grid;place-items:center;color:#fff;font-weight:800}</style></head><body><div class="wrap"><div class="card"><div class="brand"><div class="logo">ABS</div><div><h1>MK100 ABS Codierungsrechner</h1><div class="sub">ABS-Codierung einfach und übersichtlich berechnen</div></div></div></div><div class="card"><h2>VIN</h2><label>Fahrgestellnummer (17 Zeichen)<input id="vin" maxlength="17" value="WV2ZZZ7HZJH090328"></label></div><div class="card"><h2>Fahrzeug / Grunddaten</h2><div class="grid"><label>Fahrzeug<select id="b0"><option value="30">30 – Multivan (7H)</option><option value="34">34 – Multivan Kombi (7H)</option><option value="45">45 – Transporter Medium Roof</option><option value="51">51 – Transporter</option><option value="55">55 – Transporter Kombi</option><option value="61">61 – California / Campervan</option><option value="86">86 – Transvan</option><option value="10">10 – Caddy (2K)</option><option value="14">14 – Caddy (2K)</option></select></label><label>Antrieb<select id="b2"><option value="40">40 – FWD</option><option value="42">42 – FWD + 1.4l TSI</option><option value="43">43 – FWD + 2.0l TSI</option><option value="80">80 – 4Motion</option><option value="C0">C0 – 4Motion + Diff-Lock</option><option value="C3">C3 – 4Motion + Diff-Lock + 2.0l TSI</option></select></label><label>Frontbremse<select id="b4"><option value="25">25 – T6 16&quot;</option><option value="65">65 – T6 17&quot;</option><option value="92">92 – Caddy 288 mm LHD</option><option value="93">93 – Caddy 288 mm RHD</option><option value="B2">B2 – Caddy 312 mm LHD</option><option value="B3">B3 – Caddy 312 mm RHD</option></select></label><label>Hill Start / Hill Descent<select id="b6"><option value="84">84 – Hill start assist</option><option value="86">86 – Hill start + hill descent</option><option value="A4">A4 – Caddy / Hill descent</option><option value="B4">B4 – Caddy / Hill start</option></select></label></div></div><div class="card"><h2>Konfiguration</h2><div class="grid"><label>Karosserie<select id="body"><option value="transport">Transporter</option><option value="camper">Camper</option><option value="kombi">Kombi</option></select></label><label>Motor / EU / Start-Stop<select id="engine"><option value="28">28 – LHD EU5 ohne Start/Stop</option><option value="29">29 – RHD EU5 ohne Start/Stop</option><option value="38">38 – LHD EU5 mit Start/Stop</option><option value="39">39 – RHD EU5 mit Start/Stop</option><option value="78">78 – LHD EU6 mit Start/Stop</option><option value="79">79 – RHD EU6 mit Start/Stop</option></select></label></div><div class="checks"><label><input type="checkbox" id="tpm9">TPM 7K9</label><label><input type="checkbox" id="tpm1">TPM 7K1</label><label><input type="checkbox" id="setbtn">TPM SET-Taste</label><label><input type="checkbox" id="espoff">ESP-Off-Taste</label><label><input type="checkbox" id="bit7">Bit 7</label></div></div><div class="card"><h2>ACC / ABS-Sensoren</h2><div class="grid"><label>ACC / City Brake<select id="b17"><option value="00">00 – kein Front Assist, kein ACC</option><option value="F1">F1 – Front Assist, kein ACC</option><option value="F5">F5 – Front Assist + ACC mit SG</option><option value="F7">F7 – Front Assist + ACC mit DSG</option></select></label><label>ABS-Sensoren<select id="b18"><option value="00">00 – passive Sensoren</option><option value="50">50 – aktive hintere Sensoren</option><option value="F0">F0 – aktive vordere + hintere Sensoren</option></select></label></div></div><div class="card"><button class="primary" onclick="calc()">CODIERUNG BERECHNEN</button><button onclick="copyCode()">KOPIEREN</button><div id="err" class="err"></div></div><div class="card result"><h2 style="color:#fff">Fertige Codierung</h2><div class="code" id="code">–</div><details><summary>Byte-für-Byte anzeigen</summary><pre id="bytes"></pre></details></div><div class="footer">Entwicklung und Programmierung von Lukas Kopper / l.kopper16@gmail.com</div></div><script>const M={b1:{2:'79',7:'7E',9:'79',E:'7E'},b3:{H:'98',K:'9B'},b5:{0:'62',1:'63',2:'64',3:'65',4:'66',5:'67',6:'68',7:'69',8:'6A',9:'6B'},b7:{0:'7E',1:'7F',2:'80',3:'81',4:'82',5:'83',6:'84',7:'85',8:'86',9:'87'},b9:{0:'75',1:'76',2:'77',3:'78',7:'79',5:'7A',6:'7B',8:'7D',9:'7E'},b11:{0:'76',1:'77',2:'78',3:'79',4:'7A',5:'7B',6:'7C',7:'7D',8:'7E',9:'7F'},b13:{0:'82',1:'83',2:'84',3:'85',4:'86',5:'87',6:'88',7:'89',8:'8A',9:'8B'}};function m(h){let n=parseInt(h,16),r=0;for(let i=0;i<8;i++)r=(r<<1)|((n>>i)&1);return r.toString(16).padStart(2,'0').toUpperCase()}function v(id){return document.getElementById(id).value}function calc(){try{let x=v('vin').trim().toUpperCase();if(!/^[A-Z0-9]{17}$/.test(x))throw Error('Bitte genau 17 Zeichen eingeben.');let b=[];b[0]=v('b0');b[1]=M.b1[x[6]];b[2]=v('b2');b[3]=M.b3[x[7]];b[4]=v('b4');b[5]=M.b5[x[12]];b[6]=v('b6');b[7]=M.b7[x[13]];b[8]=m(b[0]);b[9]=M.b9[x[14]];b[10]=m(b[2]);b[11]=M.b11[x[15]];b[12]=m(b[4]);b[13]=M.b13[x[16]];b[14]=m(b[6]);if(b.slice(1).some(z=>!z))throw Error('Für eine VIN-Stelle ist kein Tabellenwert vorhanden.');let q=2,body=v('body'),bit0=body==='kombi'?1:0,bit2=body==='camper'?0:bit0;q|=bit0;q|=bit2<<2;if(document.getElementById('tpm9').checked)q|=8;if(document.getElementById('tpm1').checked)q|=16;if(document.getElementById('setbtn').checked)q|=32;if(document.getElementById('espoff').checked)q|=64;if(document.getElementById('bit7').checked)q|=128;b[15]=q.toString(16).padStart(2,'0').toUpperCase();b[16]=v('engine');b[17]=v('b17');b[18]=v('b18');let c=b.join('')+'00';document.getElementById('code').textContent=c;document.getElementById('bytes').textContent=b.map((z,i)=>`Byte ${i+1}: ${z}`).concat('Byte 19: 00').join('\n');document.getElementById('err').textContent=''}catch(e){document.getElementById('err').textContent=e.message}}function copyCode(){navigator.clipboard.writeText(document.getElementById('code').textContent)}calc();</script></body></html>
