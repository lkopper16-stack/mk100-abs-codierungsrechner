<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MK100 Admin</title><style>body{font-family:Arial;background:#eef1f5;margin:0;padding:20px;color:#17202a}.box{max-width:900px;margin:30px auto;background:white;padding:24px;border-radius:16px;box-shadow:0 8px 30px #0002}h1{margin:0 0 5px}.sub{color:#667085;margin-bottom:20px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee}button{border:0;border-radius:8px;padding:8px 10px;font-weight:bold;cursor:pointer;margin:2px}.ok{background:#12b76a;color:white}.no{background:#f04438;color:white}.block{background:#f79009;color:white}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.msg{margin:12px 0;color:#b42318}@media(max-width:650px){table,tbody,tr,td{display:block}thead{display:none}tr{padding:10px 0;border-bottom:1px solid #ddd}td{border:0;padding:4px}}</style></head><body><div class="box"><div class="top"><div><h1>Mitgliederverwaltung</h1><div class="sub">MK100 ABS Codierungsrechner</div></div><button onclick="logout()">Abmelden</button></div><div id="msg" class="msg"></div><table><thead><tr><th>E-Mail</th><th>Status</th><th>Registriert</th><th>Aktion</th></tr></thead><tbody id="rows"></tbody></table></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient('https://mjvqdhclkqgrvqfaafzp.supabase.co','sb_publishable_H4rBbPLak0JM-9pU2ympmw_sK9Wc1En');const fn='https://mjvqdhclkqgrvqfaafzp.supabase.co/functions/v1/mk100-admin';async function session(){const{data}=await sb.auth.getSession();if(!data.session){location.href='index.html';throw 0}return data.session}async function load(){const s=await session();const r=await fetch(fn,{headers:{Authorization:'Bearer '+s.access_token}});if(r.status===403){document.getElementById('msg').textContent='Kein Administrator-Zugriff.';return}const j=await r.json();document.getElementById('rows').innerHTML=(j.members||[]).map(m=>'<tr><td>'+m.email+'</td><td>'+m.status+'</td><td>'+new Date(m.created_at).toLocaleString('de-DE')+'</td><td><button class="ok" onclick="act(\''+m.user_id+'\',\'approve\')">Freischalten</button><button class="block" onclick="act(\''+m.user_id+'\',\'block\')">Sperren</button><button class="no" onclick="act(\''+m.user_id+'\',\'reject\')">Ablehnen</button></td></tr>').join('')||'<tr><td colspan="4">Noch keine Anfragen.</td></tr>'}window.act=async(id,action)=>{const s=await session();await fetch(fn,{method:'POST',headers:{Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify({user_id:id,action})});load()};window.logout=async()=>{await sb.auth.signOut();location.href='index.html'};load();</script></body></html>
