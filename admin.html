<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MK100 – Mitgliederverwaltung</title><style>body{font-family:Arial,sans-serif;background:#eef1f5;margin:0;padding:20px;color:#17202a}.box{max-width:900px;margin:25px auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 8px 30px #0002}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.sub{color:#667085;margin-top:4px}button{border:0;border-radius:8px;padding:9px 12px;font-weight:bold;cursor:pointer}.logout{background:#eef2f6}.ok{background:#12b76a;color:#fff}.block{background:#f79009;color:#fff}.no{background:#f04438;color:#fff}.msg{padding:12px;border-radius:9px;background:#f6f7f9;margin:18px 0;display:none}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #e5e7eb}th{font-size:13px;color:#667085}@media(max-width:650px){table,thead,tbody,tr,th,td{display:block}thead{display:none}tr{padding:12px 0;border-bottom:1px solid #ddd}td{border:0;padding:4px}td:first-child{font-weight:bold}.actions{margin-top:8px}}</style></head><body><div class="box"><div class="top"><div><h1>Mitgliederverwaltung</h1><div class="sub">MK100 ABS Codierungsrechner</div></div><button class="logout" id="logout">Abmelden</button></div><div id="msg" class="msg"></div><table><thead><tr><th>E-Mail</th><th>Status</th><th>Registriert</th><th>Aktion</th></tr></thead><tbody id="rows"><tr><td colspan="4">Lade Mitglieder …</td></tr></tbody></table></div><script>const URL='https://mjvqdhclkqgrvqfaafzp.supabase.co',KEY='sb_publishable_H4rBbPLak0JM-9pU2ympmw_sK9Wc1En',FN=URL+'/functions/v1/mk100-admin';const token=()=>sessionStorage.getItem('mk100_token');const msg=document.getElementById('msg');function show(t){msg.textContent=t;msg.style.display='block'}async function call(path='',opts={}){const r=await fetch(FN+path,{...opts,headers:{apikey:KEY,Authorization:'Bearer '+token(),'Content-Type':'application/json',...(opts.headers||{})}});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||j.message||'HTTP '+r.status);return j}async function load(){if(!token()){location.href='index.html';return}try{const j=await call();const rows=document.getElementById('rows');if(!j.members?.length){rows.innerHTML='<tr><td colspan="4">Noch keine Mitglieder.</td></tr>';return}rows.innerHTML=j.members.map(m=>{const s=m.status==='approved'?'🟢 Freigeschaltet':m.status==='blocked'?'🔴 Gesperrt':m.status==='rejected'?'⚪ Abgelehnt':'🟡 Wartet';return '<tr><td>'+m.email+'</td><td>'+s+'</td><td>'+new Date(m.created_at).toLocaleString('de-DE')+'</td><td class="actions">'+(m.status!=='approved'?'<button class="ok" onclick="act(\''+m.user_id+'\',\'approve\')">Freischalten</button>':'')+(m.status!=='blocked'?'<button class="block" onclick="act(\''+m.user_id+'\',\'block\')">Sperren</button>':'')+(m.status!=='rejected'?'<button class="no" onclick="act(\''+m.user_id+'\',\'reject\')">Ablehnen</button>':'')+'</td></tr>'}).join('')}catch(e){show(e.message);document.getElementById('rows').innerHTML='<tr><td colspan="4">Mitglieder konnten nicht geladen werden.</td></tr>'}}window.act=async(id,action)=>{try{await call('',{method:'POST',body:JSON.stringify({user_id:id,action})});await load()}catch(e){show(e.message)}};document.getElementById('logout').onclick=()=>{sessionStorage.removeItem('mk100_token');location.href='index.html'};load();</script></body></html>
